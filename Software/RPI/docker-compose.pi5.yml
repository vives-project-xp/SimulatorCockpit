services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cockpit-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  buttons:
    build: .
    container_name: cockpit-buttons
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
    privileged: true
    command: ["python3", "buttons.py"]

volumes:
  mosquitto-data:
  mosquitto-log:
